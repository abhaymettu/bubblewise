[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bubblewise"
version = "0.1.0"
description = "Let an AI agent text like a person on iMessage: native bold and italic, send effects, polls, Send Later and unsend, over imsg or BlueBubbles."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abhay Mettu" }]
dependencies = []
classifiers = ["Operating System :: MacOS", "Topic :: Communications :: Chat"]

[project.scripts]
bubblewise = "bubblewise.cli:main"

[project.urls]
Homepage = "https://github.com/abhaymettu/bubblewise"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.uv]
exclude-newer = "7 days"
